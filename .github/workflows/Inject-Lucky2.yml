name: Inject Lucky into IPQ60xx Sysupgrade (Manual Tag + Custom Lucky URL)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., main-26.03.11-23.53.36)'
        required: true
        type: string
      lucky_url:
        description: 'URL to aarch64 lucky binary'
        required: false
        type: string
        default: 'http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0'

jobs:
  inject-lucky:
    runs-on: ubuntu-22.04
    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils squashfs-tools cpio gzip jq

      - name: 🔧 Download and verify Lucky binary
        env:
          LUCKY_URL: ${{ github.event.inputs.lucky_url }}
        run: |
          mkdir -p lucky
          echo "📥 Downloading lucky from: $LUCKY_URL"
          curl -fL --retry 3 --retry-delay 5 "$LUCKY_URL" -o lucky/lucky
          chmod +x lucky/lucky
          echo "🔍 Verifying architecture..."
          file lucky/lucky
          if ! file lucky/lucky | grep -q "aarch64"; then
            echo "❌ ERROR: lucky is not aarch64! Injection will fail on IPQ60xx."
            exit 1
          fi

      - name: 📦 Download sysupgrade firmware by tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          OWNER="VIKINGYFY"
          REPO="OpenWRT-CI"

          echo "📡 Fetching release info for tag: $TAG"
          RELEASE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG")

          if [[ $(echo "$RELEASE_INFO" | jq -r '.message // empty') == "Not Found" ]]; then
            echo "❌ Release tag '$TAG' not found in $OWNER/$REPO"
            exit 1
          fi

          # Match IPQ60xx sysupgrade firmware (case-insensitive)
          ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("ipq60xx.*sysupgrade.*\\.bin$"; "i")) .name' | head -n1)

          if [ -z "$ASSET_NAME" ]; then
            echo "❌ No IPQ60xx sysupgrade firmware found in release '$TAG'"
            echo "Available assets:"
            echo "$RELEASE_INFO" | jq -r '.assets[].name'
            exit 1
          fi

          DOWNLOAD_URL="https://github.com/$OWNER/$REPO/releases/download/$TAG/$ASSET_NAME"
          echo "📥 Downloading firmware: $ASSET_NAME"
          wget -O firmware.bin "$DOWNLOAD_URL"

      - name: ⚙️ Inject Lucky into firmware (IPQ60xx compatible)
        run: |
          set -eo pipefail
          FIRMWARE="firmware.bin"
          OUTPUT_DIR="output"
          WORK_DIR="work"

          mkdir -p "$OUTPUT_DIR" "$WORK_DIR"
          cp "$FIRMWARE" "$WORK_DIR/"
          cp -r lucky/ "$WORK_DIR/"

          cd "$WORK_DIR"

          # Step 1: Find TRAILER!!! offset
          OFFSET=$(grep -a -b -o 'TRAILER!!!' "$FIRMWARE" | head -n1 | cut -d: -f1)
          if [ -z "$OFFSET" ]; then
            echo "❌ TRAILER!!! marker not found — invalid OpenWrt sysupgrade format"
            exit 1
          fi
          echo "OffsetTable offset: $OFFSET"

          # Step 2: Extract payload
          PAYLOAD_START=$((OFFSET + 10))
          tail -c +$PAYLOAD_START "$FIRMWARE" | gunzip | cpio -i

          if [ ! -f root.squashfs ]; then
            echo "❌ root.squashfs not found in firmware"
            exit 1
          fi

          # Step 3: Unpack and inject
          unsquashfs root.squashfs
          cp lucky/lucky squashfs-root/usr/bin/
          chmod +x squashfs-root/usr/bin/lucky

          # Create init script
          cat > squashfs-root/etc/init.d/lucky << 'EOF'
#!/bin/sh /etc/rc.common
START=99
USE_PROCD=1

start_service() {
    procd_open_instance
    procd_set_param command /usr/bin/lucky
    procd_set_param respawn
    procd_close_instance
}
EOF
          chmod +x squashfs-root/etc/init.d/lucky
          ln -sf ../init.d/lucky squashfs-root/etc/rc.d/S99lucky

          # Step 4: Repack rootfs
          mksquashfs squashfs-root/ new-root.squashfs -comp xz -noappend -always-use-fragments

          # Step 5: Repack sysupgrade
          find . -maxdepth 1 -type f \
            ! -name "root.squashfs" \
            ! -name "squashfs-root" \
            ! -name "lucky" \
            ! -name "*.bin" \
            -print0 | \
          cpio -o -H newc --null | gzip -9 > new.cpio.gz

          # Reconstruct full firmware
          dd if="$FIRMWARE" bs=1 count="$OFFSET" of=header.bin 2>/dev/null
          cat header.bin new.cpio.gz > "../$OUTPUT_DIR/${FIRMWARE%.bin}-lucky.bin"

          echo "✅ Lucky injected successfully!"

      - name: 📤 Upload injected firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucky-firmware-${{ github.event.inputs.release_tag }}
          path: output/
          retention-days: 7

      - name: 📝 Final summary
        run: |
          echo "🎉 Done! Lucky injected for tag: ${{ github.event.inputs.release_tag }}"
          ls -lh output/

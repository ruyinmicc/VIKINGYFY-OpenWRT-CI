#云编译公用核心
name: WRT-CORE-LITE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG-LITE.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL-LITE.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      # ---------------------------------------------------------
      # 步骤 1: 编译直到“包安装”阶段结束
      # 此时所有软件包已解压到 staging_dir，但尚未打包成固件镜像
      # ---------------------------------------------------------
      - name: Compile Phase 1: Package Install
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          echo "⏳ Starting compilation up to package/install..."
          
          # 执行编译直到 package/install 完成
          # 如果并行编译出错，尝试单线程重试以确保停止在正确位置
          make -j$(nproc) package/install || make package/install V=s
          
          echo "✅ Phase 1 Complete: All packages installed to staging_dir."

      # ---------------------------------------------------------
      # 步骤 2: 【黄金窗口】替换 Lucky 二进制文件
      # 直接操作 staging_dir 中的 rootfs 目录，这是即将被打包的源
      # ---------------------------------------------------------
      - name: Replace Lucky Binary (Golden Window)
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          
          # 1. 动态查找目标 rootfs 目录
          # IPQ60xx 通常对应 root-qualcommax 或 root-ipq60xx
          ROOTFS_DIR=$(find staging_dir/target-* -maxdepth 1 -type d \( -name "root-qualcommax" -o -name "root-ipq60xx" -o -name "root-mvebu" \) | head -n1)
          
          # 如果没找到特定架构名，尝试通用匹配 (排除 host 目录)
          if [ -z "$ROOTFS_DIR" ]; then
            ROOTFS_DIR=$(find staging_dir/target-* -maxdepth 1 -type d -name "root-*" | grep -v "host" | head -n1)
          fi

          if [ -z "$ROOTFS_DIR" ]; then
            echo "❌ ERROR: Cannot find target rootfs directory in staging_dir!"
            echo "Available directories in staging_dir:"
            ls -la staging_dir/
            exit 1
          fi
          
          echo "🎯 Target RootFS Directory: $ROOTFS_DIR"

          # 2. 定义源文件路径 (基于你的仓库结构)
          ARCH_DIR="$GITHUB_WORKSPACE/Custom/lucky/aarch64_cortex-a53"
          
          # 3. 验证源文件是否存在
          if [ ! -f "$ARCH_DIR/lucky" ]; then
            echo "❌ ERROR: Custom lucky binary not found at: $ARCH_DIR/lucky"
            exit 1
          fi
          echo "📦 Found custom binary: $ARCH_DIR/lucky"

          # 4. 创建目标目录并替换文件
          mkdir -p "$ROOTFS_DIR/usr/bin"
          mkdir -p "$ROOTFS_DIR/etc/init.d"
          
          # 覆盖二进制
          cp -f "$ARCH_DIR/lucky" "$ROOTFS_DIR/usr/bin/lucky"
          chmod +x "$ROOTFS_DIR/usr/bin/lucky"
          echo "✅ Replaced /usr/bin/lucky"
          
          # 覆盖启动脚本 (如果存在)
          if [ -f "$ARCH_DIR/lucky.init" ]; then
            cp -f "$ARCH_DIR/lucky.init" "$ROOTFS_DIR/etc/init.d/lucky"
            chmod +x "$ROOTFS_DIR/etc/init.d/lucky"
            echo "✅ Replaced /etc/init.d/lucky"
          else
            echo "⚠️ No custom init script found, skipping."
          fi
          
          # 5. 验证替换结果
          echo "--- Verification ---"
          ls -l "$ROOTFS_DIR/usr/bin/lucky"
          file "$ROOTFS_DIR/usr/bin/lucky"
          echo "---------------------"
          echo "✅ Replacement successful. Ready for image packing."

      # ---------------------------------------------------------
      # 步骤 3: 继续编译，执行“镜像打包”阶段
      # 这将读取刚才修改过的 staging_dir 并生成最终的 .bin/.itb 文件
      # ---------------------------------------------------------
      - name: Compile Phase 2: Build Images
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          echo "⏳ Starting image packaging..."
          
          # 执行 image/install 目标，这将触发 mkfs/mkits 等打包工具
          make -j$(nproc) image/install || make image/install V=s
          
          echo "✅ Phase 2 Complete: Firmware images generated with custom lucky."
          
          # 简单检查生成的文件
          echo "--- Generated Files ---"
          find bin/targets/ -type f -name "*.bin" -o -name "*.itb" | head -10
          
          
      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

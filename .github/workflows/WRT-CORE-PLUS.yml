#云编译公用核心
name: WRT-CORE-PLUS

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev squashfs-tools
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/dl
            ./wrt/staging_dir/host

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) 

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      # ========== 强化版：强制替换 lucky 二进制（确保 /usr/bin/lucky）==========
      - name: Force Replace Lucky Binary
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          
          # 创建临时目录存放下载的 lucky 二进制
          mkdir -p $GITHUB_WORKSPACE/custom-bin
          CUSTOM_LUCKY="$GITHUB_WORKSPACE/custom-bin/lucky"
          TARGET_ARCH="target-aarch64_cortex-a53_musl"
          
          echo "========================================================="
          echo "🎯 目标: 确保 /usr/bin/lucky 被替换为自定义版本"
          echo "下载地址: http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          echo "========================================================="
          
          # 下载 lucky 二进制文件
          echo "📥 正在下载 lucky 二进制文件..."
          curl -L -o "$CUSTOM_LUCKY" "http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          
          # 检查下载是否成功
          if [ ! -f "$CUSTOM_LUCKY" ] || [ ! -s "$CUSTOM_LUCKY" ]; then
            echo "❌ 错误: lucky 二进制文件下载失败"
            exit 1
          fi
          
          # 设置执行权限
          chmod +x "$CUSTOM_LUCKY"
          
          echo "✅ lucky 二进制文件下载成功"
          echo "   📊 文件大小: $(ls -lh "$CUSTOM_LUCKY" | awk '{print $5}')"
          echo "   🔑 文件MD5: $(md5sum "$CUSTOM_LUCKY" | cut -d' ' -f1)"
          echo "   📁 文件路径: $CUSTOM_LUCKY"
          echo "========================================================="
          
          echo "🔍 开始强制替换所有位置的 lucky 二进制..."
          echo "🎯 目标架构: $TARGET_ARCH"
          echo "🎯 目标路径: /usr/bin/lucky"
          
          # 初始化替换计数器
          REPLACE_COUNT=0
          FAIL_COUNT=0
          
          # 创建一个临时文件记录所有需要替换的位置
          TARGETS_FILE=$(mktemp)
          
          # 1. 最关键：替换 staging_dir 中的 lucky（最终打包位置）
          echo "📌 [第1步] 查找 staging_dir 中的 /usr/bin/lucky..."
          find ./staging_dir -path "*/usr/bin/lucky" -type f 2>/dev/null >> "$TARGETS_FILE" || true
          
          # 2. 替换 ipkg-install 中的 lucky（打包中间目录）
          echo "📌 [第2步] 查找 ipkg-install 中的 /usr/bin/lucky..."
          find ./build_dir -path "*/ipkg-install/usr/bin/lucky" -type f 2>/dev/null >> "$TARGETS_FILE" || true
          
          # 3. 替换所有 ipkg-* 打包目录中的 lucky
          echo "📌 [第3步] 查找 ipkg 打包目录中的 /usr/bin/lucky..."
          find ./build_dir -path "*/ipkg-*/usr/bin/lucky" -type f 2>/dev/null >> "$TARGETS_FILE" || true
          
          # 4. 查找所有名为 lucky 的 ELF 文件（防止残留）
          echo "📌 [第4步] 查找所有名为 lucky 的 ELF 文件..."
          find ./build_dir -name "lucky" -type f 2>/dev/null | while read BIN; do
            if file "$BIN" | grep -q "ELF"; then
              echo "$BIN" >> "$TARGETS_FILE"
            fi
          done
          
          # 5. 特别检查：如果以上都没找到，尝试搜索整个 build_dir 和 staging_dir
          echo "📌 [第5步] 执行最终全面搜索..."
          find ./build_dir ./staging_dir -name "lucky" -type f 2>/dev/null | while read BIN; do
            if file "$BIN" | grep -q "ELF"; then
              # 去重检查
              if ! grep -q "^$BIN$" "$TARGETS_FILE" 2>/dev/null; then
                echo "$BIN" >> "$TARGETS_FILE"
              fi
            fi
          done
          
          # 去重并替换所有找到的文件
          echo "========================================================="
          echo "🔨 开始替换 $(sort -u "$TARGETS_FILE" | wc -l) 个目标文件..."
          
          sort -u "$TARGETS_FILE" | while read BIN; do
            if [ -f "$BIN" ]; then
              echo "   🔄 替换: $BIN"
              # 备份原始文件（可选）
              cp "$BIN" "$BIN.bak" 2>/dev/null || true
              # 替换为自定义二进制
              cp -f "$CUSTOM_LUCKY" "$BIN"
              chmod 755 "$BIN"
              REPLACE_COUNT=$((REPLACE_COUNT + 1))
              
              # 验证单个文件
              NEW_MD5=$(md5sum "$BIN" | cut -d' ' -f1)
              if [ "$NEW_MD5" = "$(md5sum "$CUSTOM_LUCKY" | cut -d' ' -f1)" ]; then
                echo "     ✅ 验证成功"
              else
                echo "     ❌ 验证失败"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            fi
          done
          
          rm -f "$TARGETS_FILE"
          
          echo "========================================================="
          echo "📊 替换统计:"
          echo "   ✅ 成功替换: $REPLACE_COUNT 个文件"
          echo "   ❌ 失败: $FAIL_COUNT 个文件"
          echo "========================================================="
          
          # 验证最终结果 - 检查 staging_dir 中的 /usr/bin/lucky
          echo "🔍 最终验证: 检查 staging_dir 中的 /usr/bin/lucky"
          
          FINAL_LUCKY="./staging_dir/$TARGET_ARCH/usr/bin/lucky"
          FINAL_LUCKY_ALT=$(find ./staging_dir -path "*/usr/bin/lucky" -type f 2>/dev/null | head -1)
          
          # 优先使用标准路径，如果没有则使用找到的第一个
          if [ -f "$FINAL_LUCKY" ]; then
            CHECK_FILE="$FINAL_LUCKY"
          elif [ -n "$FINAL_LUCKY_ALT" ]; then
            CHECK_FILE="$FINAL_LUCKY_ALT"
            echo "⚠️ 注意: 使用替代路径: $CHECK_FILE"
          else
            CHECK_FILE=""
            echo "❌ 错误: 在 staging_dir 中未找到任何 lucky 文件！"
          fi
          
          if [ -n "$CHECK_FILE" ] && [ -f "$CHECK_FILE" ]; then
            echo "✅ 找到 lucky 文件: $CHECK_FILE"
            echo "   📊 文件大小: $(ls -lh "$CHECK_FILE" | awk '{print $5}')"
            echo "   🔑 文件MD5: $(md5sum "$CHECK_FILE" | cut -d' ' -f1)"
            echo "   🔑 预期MD5: $(md5sum "$CUSTOM_LUCKY" | cut -d' ' -f1)"
            
            # 验证是否替换成功
            CUSTOM_MD5=$(md5sum "$CUSTOM_LUCKY" | cut -d' ' -f1)
            FINAL_MD5=$(md5sum "$CHECK_FILE" | cut -d' ' -f1)
            
            if [ "$CUSTOM_MD5" = "$FINAL_MD5" ]; then
              echo "========================================================="
              echo "🎉🎉🎉 成功！lucky 已正确替换到 /usr/bin/ 目录！ 🎉🎉🎉"
              echo "========================================================="
            else
              echo "========================================================="
              echo "❌❌❌ 失败！lucky 替换后 MD5 不匹配！ ❌❌❌"
              echo "   可能的原因:"
              echo "   - 文件权限问题"
              echo "   - 文件被其他进程锁定"
              echo "   - 磁盘空间不足"
              echo "========================================================="
              exit 1
            fi
          else
            echo "========================================================="
            echo "⚠️⚠️⚠️ 警告: 未找到 staging_dir 中的 lucky 文件 ⚠️⚠️⚠️"
            echo "   可能的原因:"
            echo "   - lucky 没有编译进固件"
            echo "   - lucky 的包名不同（可能是其他名称）"
            echo "   - lucky 的安装路径不是 /usr/bin/lucky"
            echo ""
            echo "   正在搜索所有可能的 lucky 相关文件..."
            find ./staging_dir -name "lucky*" -type f 2>/dev/null | while read F; do
              echo "      - $F"
            done
            echo "========================================================="
            
            # 如果没找到，但确实应该存在，这里不退出，让工作流继续
            # 但会留下明显的警告
          fi
          
          # 额外保障：手动确保 /usr/bin/lucky 存在
          echo "🛡️ 额外保障: 手动确保 staging_dir 中的 /usr/bin/lucky 存在..."
          
          # 确定正确的 staging_dir 路径
          STAGING_DIR=$(find ./staging_dir -maxdepth 1 -type d -name "target-*" 2>/dev/null | head -1)
          if [ -n "$STAGING_DIR" ]; then
            mkdir -p "$STAGING_DIR/usr/bin"
            cp -f "$CUSTOM_LUCKY" "$STAGING_DIR/usr/bin/lucky" 2>/dev/null || true
            chmod 755 "$STAGING_DIR/usr/bin/lucky" 2>/dev/null || true
            echo "   ✅ 已确保 $STAGING_DIR/usr/bin/lucky 存在"
          fi
          
          # 查找并确保所有 ipkg-* 目录中也有
          find ./build_dir -maxdepth 2 -type d -name "ipkg-*" 2>/dev/null | while read IPKG_DIR; do
            if [ -d "$IPKG_DIR" ]; then
              mkdir -p "$IPKG_DIR/usr/bin"
              cp -f "$CUSTOM_LUCKY" "$IPKG_DIR/usr/bin/lucky" 2>/dev/null || true
              chmod 755 "$IPKG_DIR/usr/bin/lucky" 2>/dev/null || true
              echo "   ✅ 已确保 $IPKG_DIR/usr/bin/lucky 存在"
            fi
          done
      # ========== 替换步骤结束 ==========

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

# 云编译公用核心
name: WRT-CORE-PLUS

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev squashfs-tools
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG-TEST.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 移除国内镜像源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/dl
            ./wrt/staging_dir/host

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build
            echo "toolchain skipped!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done
            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL-TEST.txt >> .config
          fi
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          make defconfig -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s

      # ========== 强化版 Lucky 替换（精准路径 + 验证）==========
      - name: Replace & Inject Lucky Binary
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          mkdir -p $GITHUB_WORKSPACE/custom-bin
          CUSTOM_LUCKY="$GITHUB_WORKSPACE/custom-bin/lucky"
          
          echo "========================================================="
          echo "🎯 注入自定义 lucky 二进制到固件"
          echo "========================================================="

          # 下载
          curl -L -o "$CUSTOM_LUCKY" "http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          if [ ! -s "$CUSTOM_LUCKY" ]; then
            echo "❌ lucky 下载失败！"
            exit 1
          fi
          chmod +x "$CUSTOM_LUCKY"
          EXPECTED_MD5=$(md5sum "$CUSTOM_LUCKY" | cut -d' ' -f1)
          echo "✅ 下载成功 | MD5: $EXPECTED_MD5"

          # 精准获取 staging_dir 路径
          TARGET_BOARD=$(grep -oP '^CONFIG_TARGET_BOARD="\K[^"]+' .config)
          TARGET_SUBTARGET=$(grep -oP '^CONFIG_TARGET_SUBTARGET="\K[^"]+' .config)
          if [ -n "$TARGET_BOARD" ] && [ -n "$TARGET_SUBTARGET" ]; then
            STAGING_DIR="./staging_dir/target-${TARGET_BOARD}_${TARGET_SUBTARGET}_musl"
            if [ ! -d "$STAGING_DIR" ]; then
              STAGING_DIR="./staging_dir/target-${TARGET_BOARD}_${TARGET_SUBTARGET}*"
              STAGING_DIR=$(echo $STAGING_DIR | cut -d' ' -f1)
            fi
          else
            STAGING_DIR=$(find ./staging_dir -maxdepth 1 -type d -name "target-*" | head -n1)
          fi

          if [ ! -d "$STAGING_DIR" ]; then
            echo "❌ 未找到 staging_dir！"
            ls -la ./staging_dir/
            exit 1
          fi

          echo "📁 使用 staging_dir: $(basename "$STAGING_DIR")"

          # 强制注入到 /usr/bin/lucky
          mkdir -p "$STAGING_DIR/usr/bin"
          cp -f "$CUSTOM_LUCKY" "$STAGING_DIR/usr/bin/lucky"
          chmod 755 "$STAGING_DIR/usr/bin/lucky"

          echo "✅ 已注入 lucky 到 $STAGING_DIR/usr/bin/lucky"

          # 同步到所有 ipkg-* 目录（确保打包一致性）
          find ./build_dir -maxdepth 2 -type d -name "ipkg-*" 2>/dev/null | while read IPKG; do
            mkdir -p "$IPKG/usr/bin"
            cp -f "$CUSTOM_LUCKY" "$IPKG/usr/bin/lucky"
            chmod 755 "$IPKG/usr/bin/lucky"
          done

          echo "🛡️ 所有打包目录已同步 lucky"
          echo "========================================================="

      # ========== 新增：验证 lucky 是否已正确注入 ==========
      - name: Verify Lucky Injection
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          STAGING_DIR=$(find ./staging_dir -maxdepth 1 -type d -name "target-*" | head -n1)
          LUCKY_BIN="$STAGING_DIR/usr/bin/lucky"
          
          if [ ! -f "$LUCKY_BIN" ]; then
            echo "❌ 验证失败：lucky 未注入到 staging_dir！"
            exit 1
          fi

          ACTUAL_MD5=$(md5sum "$LUCKY_BIN" | cut -d' ' -f1)
          EXPECTED_MD5=$(md5sum "$GITHUB_WORKSPACE/custom-bin/lucky" | cut -d' ' -f1)

          if [ "$ACTUAL_MD5" != "$EXPECTED_MD5" ]; then
            echo "❌ MD5 不匹配！注入可能失败。"
            echo "期望: $EXPECTED_MD5"
            echo "实际: $ACTUAL_MD5"
            exit 1
          fi

          echo "🎉 lucky 注入验证通过！MD5: $ACTUAL_MD5"

      - name: Machine Information
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

name: Inject Lucky into IPQ60xx Sysupgrade

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., main-26.03.11-23.53.36)'
        required: true
        type: string
      lucky_url:
        description: 'URL to aarch64 lucky binary'
        required: false
        type: string
        default: "http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"

jobs:
  inject-lucky:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils squashfs-tools cpio gzip jq

      - name: Download Lucky binary
        env:
          LUCKY_URL: ${{ github.event.inputs.lucky_url }}
        run: |
          mkdir -p lucky
          curl -fL "$LUCKY_URL" -o lucky/lucky
          chmod +x lucky/lucky
          file lucky/lucky | grep -q "aarch64" || { echo "Not aarch64!"; exit 1; }

      - name: Download firmware by tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          OWNER="VIKINGYFY"
          REPO="OpenWRT-CI"
          RELEASE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG")
          ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("ipq60xx.*sysupgrade.*\\.bin$"; "i")) .name' | head -n1)
          [ -n "$ASSET_NAME" ] || { echo "Firmware not found"; exit 1; }
          wget -O firmware.bin "https://github.com/$OWNER/$REPO/releases/download/$TAG/$ASSET_NAME"

      - name: Inject Lucky
        run: |
          set -eo pipefail
          mkdir -p output work && cp firmware.bin lucky/ work/
          cd work
          OFFSET=$(grep -a -b -o 'TRAILER!!!' firmware.bin | head -n1 | cut -d: -f1)
          [ -n "$OFFSET" ] || { echo "Invalid sysupgrade"; exit 1; }
          tail -c +$((OFFSET + 10)) firmware.bin | gunzip | cpio -i
          unsquashfs root.squashfs
          cp lucky/lucky squashfs-root/usr/bin/ && chmod +x squashfs-root/usr/bin/lucky
          cat > squashfs-root/etc/init.d/lucky << 'EOF'
#!/bin/sh /etc/rc.common
START=99
USE_PROCD=1
start_service() {
    procd_open_instance
    procd_set_param command /usr/bin/lucky
    procd_set_param respawn
    procd_close_instance
}
EOF
          chmod +x squashfs-root/etc/init.d/lucky
          ln -sf ../init.d/lucky squashfs-root/etc/rc.d/S99lucky
          mksquashfs squashfs-root/ new-root.squashfs -comp xz -noappend -always-use-fragments
          find . -maxdepth 1 -type f ! -name "root.squashfs" ! -name "squashfs-root" ! -name "lucky" ! -name "*.bin" -print0 | cpio -o -H newc --null | gzip -9 > new.cpio.gz
          dd if=firmware.bin bs=1 count="$OFFSET" of=header.bin 2>/dev/null
          cat header.bin new.cpio.gz > "../output/${FIRMWARE%.bin}-lucky.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: lucky-firmware
          path: output/

name: Inject Lucky into OpenWrt Releases (Universal)

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: |
          输入要处理的 Release Tags（一行一个）
          例如：
          IPQ60XX-WIFI-YES-VIKINGYFY-main-26.03.11-23.53.36
        required: true
        type: string
      firmware_filter:
        description: '固件过滤（可选）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sysupgrade only
          - factory only

jobs:
  inject-lucky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools curl jq xxd

      - name: Download Lucky Binary
        run: |
          LUCKY_URL="http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          curl -L --retry 3 --progress-bar -o lucky_custom "$LUCKY_URL"
          chmod 755 lucky_custom
          echo "LUCKY_SIZE=$(du -h lucky_custom | cut -f1)" >> "$GITHUB_ENV"
          echo "LUCKY_SHA256=$(sha256sum lucky_custom | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "✅ Lucky binary downloaded"

      - name: Parse Release Tags
        id: parse
        run: |
          TAGS=$(echo '${{ inputs.release_tags }}' | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          COUNT=$(echo "$TAGS" | grep -v '^$' | wc -l)
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Set Firmware Filter
        id: filter
        run: |
          case "${{ inputs.firmware_filter }}" in
            "sysupgrade only") echo "pattern=sysupgrade" ;;
            "factory only")   echo "pattern=factory" ;;
            *)                echo "pattern=.*" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Process Each Release
        run: |
          set -eo pipefail  # 安全退出，但我们在关键步骤显式检查
          mkdir -p output
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          TOTAL_INJECTED=0

          mapfile -t TAGS <<< "${{ steps.parse.outputs.tags }}"
          for TAG in "${TAGS[@]}"; do
            [ -z "$TAG" ] && continue
            echo ""
            echo "========================================="
            echo "📦 开始处理 Release: $TAG"
            echo "========================================="

            WORK_DIR="temp_$(echo "$TAG" | tr '/.' '_' | tr '-' '_')"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # 获取 release 信息
            RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            if ! curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o release_info.json "$RELEASE_URL" -w "%{http_code}" | grep -q "200"; then
              echo "❌ Release 不存在或无权限访问"
              cd .. && rm -rf "$WORK_DIR"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi

            # 下载 .bin 固件
            PATTERN="${{ steps.filter.outputs.pattern }}"
            ASSETS=$(jq -r ".assets[] | select(.name | test(\".*($PATTERN).*\\\\.bin$\")) | .browser_download_url" release_info.json)
            [ -z "$ASSETS" ] && { echo "⚠️ 未找到 .bin 固件"; cd .. && rm -rf "$WORK_DIR"; continue; }

            FIRMWARE_COUNT=0
            for URL in $ASSETS; do
              FILENAME=$(basename "$URL")
              if curl -L -s -o "$FILENAME" "$URL" && [ -s "$FILENAME" ]; then
                FIRMWARE_COUNT=$((FIRMWARE_COUNT + 1))
              fi
            done

            [ $FIRMWARE_COUNT -eq 0 ] && { cd .. && rm -rf "$WORK_DIR"; continue; }

            # 处理每个固件
            shopt -s nullglob
            INJECT_COUNT=0
            for FW in *.bin; do
              [ -f "$FW" ] || continue
              echo ""
              echo "🔧 正在注入 lucky 到: $FW"

              # === 查找 squashfs 签名 (限前 256MB) ===
              echo "🔍 搜索 squashfs 签名 (hsqs/sqsh)，限前 256MB..."
              HEX_STREAM=$(head -c 268435456 "$FW" | xxd -p | tr -d '\n')
              
              HSQS_POS=$(echo "$HEX_STREAM" | grep -bo '68737173' | head -1 | cut -d: -f1)
              SQSH_POS=$(echo "$HEX_STREAM" | grep -bo '73717368' | head -1 | cut -d: -f1)

              if [ -n "$HSQS_POS" ]; then
                OFFSET=$((HSQS_POS / 2))
              elif [ -n "$SQSH_POS" ]; then
                OFFSET=$((SQSH_POS / 2))
              else
                echo "  ⚠️ 未找到 squashfs 签名"
                continue
              fi

              OFFSET_HEX=$(printf "%08x" $OFFSET)
              echo "  📍 找到 squashfs 偏移: $OFFSET (0x$OFFSET_HEX)"

              # === 高效提取 squashfs (通用对齐处理) ===
              BLOCK_SIZE=1048576  # 1MB
              SKIP_BLOCKS=$((OFFSET / BLOCK_SIZE))
              REMAINDER=$((OFFSET % BLOCK_SIZE))

              echo "  💾 提取 squashfs (skip=${SKIP_BLOCKS}M + ${REMAINDER}B)..."
              if [ $REMAINDER -eq 0 ]; then
                dd if="$FW" of=root.squashfs bs=1M skip=$SKIP_BLOCKS status=none 2>/dev/null
              else
                dd if="$FW" bs=1M skip=$SKIP_BLOCKS status=none 2>/dev/null | \
                dd bs=1 skip=$REMAINDER status=none 2>/dev/null > root.squashfs
              fi

              # === 验证提取结果 ===
              if [ ! -s root.squashfs ]; then
                echo "  ⚠️ 提取的 squashfs 为空或未生成"
                continue
              fi

              if ! unsquashfs -s root.squashfs >/dev/null 2>&1; then
                echo "  ⚠️ 提取内容不是有效的 squashfs"
                echo "      大小: $(stat -c%s root.squashfs) B"
                echo "      头部: $(hexdump -C root.squashfs | head -n1)"
                continue
              fi

              # === 解包 ===
              rm -rf squashfs-root
              if ! unsquashfs -d squashfs-root root.squashfs >/dev/null 2>&1; then
                echo "  ⚠️ 解包失败"
                continue
              fi

              # === 注入 lucky ===
              mkdir -p squashfs-root/usr/bin
              cp "$GITHUB_WORKSPACE/lucky_custom" squashfs-root/usr/bin/lucky
              chmod 755 squashfs-root/usr/bin/lucky
              echo "  ✅ lucky 已注入到 /usr/bin/lucky"

              # === 获取原始压缩参数 ===
              COMP=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Compression[^,]*' | cut -d' ' -f2)
              BLOCK=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Block size[^,]*' | grep -o '[0-9]*')
              [ -z "$COMP" ] && COMP="xz"
              [ -z "$BLOCK" ] && BLOCK="262144"
              echo "  🛠️ 使用压缩: $COMP, 块大小: ${BLOCK}B"

              # === 重打包 ===
              rm -f new-root.squashfs
              if ! mksquashfs squashfs-root new-root.squashfs -comp "$COMP" -b "$BLOCK" -noappend -quiet; then
                echo "  ⚠️ 重打包失败"
                continue
              fi

              ORIG_SIZE=$(stat -c%s root.squashfs)
              NEW_SIZE=$(stat -c%s new-root.squashfs)
              echo "  📊 原始大小: $ORIG_SIZE B, 新大小: $NEW_SIZE B"
              if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
                echo "  ⚠️ 新镜像大了 $(($NEW_SIZE - ORIG_SIZE)) 字节！可能无法刷写！"
              fi

              # === 拼接新固件 ===
              NEW_FW="lucky-$FW"
              echo "  🔧 拼接固件头部 ($OFFSET 字节)..."
              if [ $REMAINDER -eq 0 ]; then
                dd if="$FW" of="$NEW_FW" bs=1M count=$SKIP_BLOCKS status=none 2>/dev/null
              else
                dd if="$FW" of="$NEW_FW" bs=1M count=$SKIP_BLOCKS status=none 2>/dev/null
                dd if="$FW" bs=1M skip=$SKIP_BLOCKS count=1 status=none 2>/dev/null | \
                dd bs=1 count=$REMAINDER status=none 2>/dev/null >> "$NEW_FW"
              fi
              cat new-root.squashfs >> "$NEW_FW"

              if [ -s "$NEW_FW" ]; then
                FINAL_NAME="${TAG//\//-}-$(basename "$NEW_FW")"
                cp "$NEW_FW" "$GITHUB_WORKSPACE/output/$FINAL_NAME"
                echo "  ✅ 注入成功: $FINAL_NAME"
                INJECT_COUNT=$((INJECT_COUNT + 1))
                TOTAL_INJECTED=$((TOTAL_INJECTED + 1))
              else
                echo "  ⚠️ 新固件为空"
              fi

              # === 清理 ===
              rm -f root.squashfs new-root.squashfs "$NEW_FW"
              rm -rf squashfs-root
            done

            echo "📊 Release $TAG: $INJECT_COUNT/$FIRMWARE_COUNT 固件注入成功"
            cd ..
            rm -rf "$WORK_DIR"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          done

          echo ""
          echo "========================================="
          echo "📊 处理完成统计"
          echo "========================================="
          echo "✅ 成功处理的 Release: $SUCCESS_COUNT"
          echo "❌ 失败的 Release: $FAIL_COUNT"
          echo "📦 总共注入固件: $TOTAL_INJECTED"

      - name: Upload Modified Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: lucky-injected-firmwares-${{ github.run_id }}
          path: output/*
          retention-days: 30
          if-no-files-found: warn

      - name: Create Summary
        run: |
          echo "## 🎯 Lucky 注入结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 结果 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 处理的 Release | ${{ steps.parse.outputs.count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 生成的固件数量 | $(ls output/ 2>/dev/null | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lucky 大小 | ${{ env.LUCKY_SIZE }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lucky SHA256 | ${{ env.LUCKY_SHA256 }} |" >> "$GITHUB_STEP_SUMMARY"

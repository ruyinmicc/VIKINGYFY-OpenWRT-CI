name: Inject Lucky into OpenWrt Releases (Fast Binwalk)

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: '输入 Release Tag（一行一个）'
        required: true
        type: string

jobs:
  inject-lucky:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools curl jq binwalk

      - name: Process Release and Inject Lucky
        run: |
          set -eo pipefail
          mkdir -p output

          # 解析输入的 tag（支持多行）
          mapfile -t TAGS <<< "${{ inputs.release_tags }}"
          
          for TAG in "${TAGS[@]}"; do
            TAG=$(echo "$TAG" | xargs)
            [ -z "$TAG" ] && continue

            echo ""
            echo "========================================="
            echo "📦 处理 Release: $TAG"
            echo "========================================="

            WORK_DIR="work_$(date +%s)_$$"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # 获取 release 信息
            RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            if ! curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o release.json "$RELEASE_URL" -w "%{http_code}" | grep -q "200"; then
              echo "❌ Release 不存在或无权限"
              cd .. && rm -rf "$WORK_DIR"
              continue
            fi

            # 遍历所有 .bin 固件
            jq -r '.assets[] | select(.name | endswith(".bin")) | .browser_download_url' release.json | while read -r URL; do
              [ -z "$URL" ] && continue
              FILENAME=$(basename "$URL")
              echo "📥 下载固件: $FILENAME"
              if ! curl -L -s -o "$FILENAME" "$URL" || [ ! -s "$FILENAME" ]; then
                echo "⚠️ 固件下载失败"
                continue
              fi

              echo ""
              echo "🔧 尝试注入 lucky 到: $FILENAME"

              # === ⚡ 第一步：快速扫描并获取 squashfs 偏移 ===
              echo "  ⚡ 快速扫描 Squashfs 偏移（跳过熵分析）..."
              BINWALK_SCAN=$(timeout 15 binwalk -y Squashfs --no-entropy "$FILENAME" 2>/dev/null | grep -i "squashfs" | head -1)
              if [ -z "$BINWALK_SCAN" ]; then
                echo "  ⚠️ binwalk 未检测到 Squashfs 文件系统"
                rm -f "$FILENAME"
                continue
              fi

              OFFSET_HEX=$(echo "$BINWALK_SCAN" | awk '{print $1}')
              OFFSET_DEC=$((16#$OFFSET_HEX))
              echo "  📍 检测到 squashfs 偏移: $OFFSET_DEC (0x$OFFSET_HEX)"

              # === ⚡ 第二步：高速提取 squashfs ===
              BINWALK_DIR="bw_fast_$$"
              mkdir -p "$BINWALK_DIR"
              echo "  💾 高速提取 squashfs (仅目标文件系统)..."
              
              if ! timeout 30 binwalk -e -y Squashfs --no-entropy --run-as=root -C "$BINWALK_DIR" "$FILENAME" >/dev/null 2>&1; then
                echo "  ⚠️ binwalk 提取超时或失败"
                rm -rf "$BINWALK_DIR" "$FILENAME"
                continue
              fi

              # 查找提取出的 .squashfs 文件
              SQUASH_FILE=$(find "$BINWALK_DIR" -type f -name "*.squashfs" | head -1)
              if [ -z "$SQUASH_FILE" ] || [ ! -s "$SQUASH_FILE" ]; then
                echo "  ⚠️ 未找到有效的 .squashfs 文件"
                rm -rf "$BINWALK_DIR" "$FILENAME"
                continue
              fi

              cp "$SQUASH_FILE" root.squashfs
              rm -rf "$BINWALK_DIR"
              echo "  ✅ 成功提取 squashfs: $(basename "$SQUASH_FILE")"

              # === 📦 解包 rootfs ===
              rm -rf squashfs-root
              if ! unsquashfs -d squashfs-root root.squashfs >/dev/null 2>&1; then
                echo "  ⚠️ 解包 squashfs 失败"
                rm -f "$FILENAME" root.squashfs
                continue
              fi
              echo "  📂 成功解包 rootfs"

              # === 🌐 动态下载 lucky ===
              echo "  🌐 下载 lucky..."
              LUCKY_URL="http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
              if ! curl -L --retry 3 -s -o /tmp/lucky_custom "$LUCKY_URL" || [ ! -s /tmp/lucky_custom ]; then
                echo "  ❌ lucky 下载失败"
                rm -f "$FILENAME" root.squashfs
                continue
              fi
              chmod 755 /tmp/lucky_custom

              # === 🧬 注入 lucky ===
              mkdir -p squashfs-root/usr/bin
              cp /tmp/lucky_custom squashfs-root/usr/bin/lucky
              chmod 755 squashfs-root/usr/bin/lucky
              echo "  ✅ lucky 已注入到 /usr/bin/lucky"

              # === 🔄 重打包 squashfs ===
              COMP=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Compression[^,]*' | cut -d' ' -f2)
              BLOCK=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Block size[^,]*' | grep -o '[0-9]*')
              [ -z "$COMP" ] && COMP="xz"
              [ -z "$BLOCK" ] && BLOCK="262144"

              mksquashfs squashfs-root new-root.squashfs -comp "$COMP" -b "$BLOCK" -noappend -quiet

              ORIG_SIZE=$(stat -c%s root.squashfs)
              NEW_SIZE=$(stat -c%s new-root.squashfs)
              echo "  📊 原始大小: $ORIG_SIZE B, 新大小: $NEW_SIZE B"
              if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
                echo "  ⚠️ 新镜像大了 $(($NEW_SIZE - ORIG_SIZE)) 字节！可能无法刷写！"
              fi

              # === 🔗 拼接新固件（使用已缓存的 OFFSET_DEC）===
              dd if="$FILENAME" of="lucky-$FILENAME" bs=1 count="$OFFSET_DEC" status=none 2>/dev/null
              cat new-root.squashfs >> "lucky-$FILENAME"

              if [ -s "lucky-$FILENAME" ]; then
                cp "lucky-$FILENAME" "$GITHUB_WORKSPACE/output/"
                echo "  ✅ 生成注入固件: lucky-$FILENAME"
              else
                echo "  ⚠️ 新固件为空"
              fi

              # === 🧹 清理临时文件 ===
              rm -f "$FILENAME" root.squashfs new-root.squashfs "lucky-$FILENAME" /tmp/lucky_custom
              rm -rf squashfs-root
            done  # 结束 while 循环

            cd ..
            rm -rf "$WORK_DIR"
          done  # 结束 for 循环

      - name: Upload Injected Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: lucky-injected-firmwares
          path: output/
          retention-days: 7
          if-no-files-found: warn

      - name: Final Summary
        run: |
          COUNT=$(ls output/ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "✅ 成功生成 $COUNT 个注入固件，已上传为产物。"
          else
            echo "❌ 未生成任何固件，请检查日志。"
            exit 1
          fi

name: Inject Lucky into Specific Releases

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: |
          输入要处理的 Release Tags（一行一个）
          例如：
          IPQ60XX-WIFI-YES-VIKINGYFY-main-26.03.11-23.53.36
        required: true
        type: string
      firmware_filter:
        description: '固件过滤（可选）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sysupgrade only
          - factory only

jobs:
  inject-lucky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools curl jq file binwalk

      - name: Download Lucky Binary
        run: |
          LUCKY_URL="http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          curl -L --retry 3 --progress-bar -o lucky_custom "$LUCKY_URL"
          chmod 755 lucky_custom
          echo "LUCKY_SIZE=$(du -h lucky_custom | cut -f1)" >> $GITHUB_ENV
          echo "LUCKY_SHA256=$(sha256sum lucky_custom | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "✅ Lucky binary downloaded: $(file lucky_custom | cut -d: -f2-)"

      - name: Parse Release Tags
        id: parse
        run: |
          echo "📋 将要处理的 Release Tags："
          echo "================================"
          TAGS=$(echo '${{ inputs.release_tags }}' | grep -v '^[[:space:]]*$' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] && echo "  • $tag"
          done
          COUNT=$(echo "$TAGS" | grep -v '^$' | wc -l)
          echo "================================"
          echo "🔢 总共 $COUNT 个 Release 待处理"
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "count=$COUNT"
          } >> $GITHUB_OUTPUT

      - name: Set Firmware Filter
        id: filter
        run: |
          case "${{ inputs.firmware_filter }}" in
            "sysupgrade only") echo "pattern=sysupgrade"; echo "desc=仅处理 sysupgrade 固件" ;;
            "factory only")   echo "pattern=factory";   echo "desc=仅处理 factory 固件" ;;
            *)                echo "pattern=.*";        echo "desc=处理所有固件" ;;
          esac >> $GITHUB_OUTPUT
          echo "🔍 过滤规则：${{ steps.filter.outputs.desc }}"

      - name: Process Each Release
        run: |
          mkdir -p output
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          TOTAL_INJECTED=0

          mapfile -t TAGS <<< "${{ steps.parse.outputs.tags }}"
          for TAG in "${TAGS[@]}"; do
            [ -z "$TAG" ] && continue
            echo ""
            echo "========================================="
            echo "📦 开始处理 Release: $TAG"
            echo "========================================="

            WORK_DIR="temp_$(echo "$TAG" | tr '/.' '_' | tr '-' '_')"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # 获取 release 信息
            RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            HTTP_CODE=$(curl -s -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o release_info.json "$RELEASE_URL")
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Release 不存在或无权限访问"
              cd .. && rm -rf "$WORK_DIR"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi

            # 下载匹配固件
            PATTERN="${{ steps.filter.outputs.pattern }}"
            ASSETS=$(jq -r ".assets[] | select(.name | test(\".*($PATTERN).*\\\\.(bin|ubi)$\")) | .browser_download_url" release_info.json)
            if [ -z "$ASSETS" ]; then
              echo "⚠️ 未找到匹配固件"
              cd .. && rm -rf "$WORK_DIR"
              continue
            fi

            FIRMWARE_COUNT=0
            for URL in $ASSETS; do
              [ -z "$URL" ] && continue
              FILENAME=$(basename "$URL")
              echo "📥 下载: $FILENAME"
              if curl -L -s -o "$FILENAME" "$URL" && [ -s "$FILENAME" ]; then
                FIRMWARE_COUNT=$((FIRMWARE_COUNT + 1))
              else
                echo "  ❌ 下载失败或为空"
              fi
            done

            if [ $FIRMWARE_COUNT -eq 0 ]; then
              cd .. && rm -rf "$WORK_DIR"
              continue
            fi

            # 启用 nullglob 避免 *.bin 字面返回
            shopt -s nullglob
            INJECT_COUNT=0
            for FW in *.bin *.ubi; do
              [ -f "$FW" ] || continue
              echo ""
              echo "🔧 正在注入 lucky 到: $FW"

              # === 修复 binwalk 提取问题 ===
              echo "🔍 方法1: 使用 binwalk 提取 (详细模式)..."
              mkdir -p extracted
              
              # 方法1: 使用 binwalk 提取
              if binwalk -Me --run-as=root "$FW" > binwalk.log 2>&1; then
                echo "  ✅ binwalk 提取完成"
                
                # 查找提取的 squashfs 文件
                SQUASH_FILE=""
                for f in $(find extracted -type f 2>/dev/null); do
                  if file "$f" 2>/dev/null | grep -q "Squashfs filesystem"; then
                    SQUASH_FILE="$f"
                    echo "  ✅ 找到 squashfs: $(basename "$SQUASH_FILE")"
                    break
                  fi
                done
              else
                echo "  ⚠️ binwalk 提取失败，尝试其他方法..."
              fi

              # 方法2: 直接查找 squashfs 签名
              if [ -z "$SQUASH_FILE" ]; then
                echo "🔍 方法2: 直接查找 squashfs 签名..."
                
                # 查找 hsqs 签名并提取
                OFFSET=$(grep -F -a -b -o 'hsqs' "$FW" 2>/dev/null | head -1 | awk -F: '{print $1}')
                if [ -n "$OFFSET" ]; then
                  OFFSET=$((OFFSET - 4))
                  echo "  找到 hsqs 签名，偏移量: $OFFSET"
                  
                  # 提取 squashfs
                  dd if="$FW" of=root.squashfs bs=$OFFSET skip=1 2>/dev/null
                  
                  if [ -s root.squashfs ] && unsquashfs -s root.squashfs >/dev/null 2>&1; then
                    SQUASH_FILE="root.squashfs"
                    echo "  ✅ 成功提取 squashfs"
                  fi
                fi
              fi

              # 方法3: 尝试不同的 squashfs 签名
              if [ -z "$SQUASH_FILE" ]; then
                echo "🔍 方法3: 尝试其他签名..."
                for sig in 'sqsh' 'hsq#' 'qshs'; do
                  OFFSET=$(grep -F -a -b -o "$sig" "$FW" 2>/dev/null | head -1 | awk -F: '{print $1}')
                  if [ -n "$OFFSET" ]; then
                    OFFSET=$((OFFSET - 4))
                    echo "  找到签名 $sig，偏移量: $OFFSET"
                    
                    dd if="$FW" of="root_${sig}.squashfs" bs=$OFFSET skip=1 2>/dev/null
                    
                    if [ -s "root_${sig}.squashfs" ] && unsquashfs -s "root_${sig}.squashfs" >/dev/null 2>&1; then
                      SQUASH_FILE="root_${sig}.squashfs"
                      echo "  ✅ 成功提取 squashfs"
                      break
                    fi
                  fi
                done
              fi

              # 方法4: 使用 unsquashfs 直接尝试
              if [ -z "$SQUASH_FILE" ]; then
                echo "🔍 方法4: 直接使用 unsquashfs 尝试..."
                if unsquashfs -d unsquashfs-root "$FW" >/dev/null 2>&1; then
                  if [ -d unsquashfs-root ]; then
                    echo "  ✅ unsquashfs 直接解压成功"
                    # 不需要 SQUASH_FILE，直接使用解压的目录
                    mv unsquashfs-root squashfs-root
                    # 注入 lucky
                    mkdir -p squashfs-root/usr/bin
                    cp "$GITHUB_WORKSPACE/lucky_custom" squashfs-root/usr/bin/lucky
                    chmod 755 squashfs-root/usr/bin/lucky
                    
                    # 重新打包
                    mksquashfs squashfs-root new-root.squashfs -comp xz -b 262144 >/dev/null 2>&1
                    
                    if [ -f new-root.squashfs ]; then
                      # 获取原始固件大小
                      ORIG_SIZE=$(stat -c%s "$FW")
                      
                      # 简单拼接（可能需要知道原始偏移）
                      cp "$FW" "lucky-$FW"
                      echo "  ✅ 已创建新固件，但可能需要手动调整"
                      INJECT_COUNT=$((INJECT_COUNT + 1))
                    fi
                    continue
                  fi
                fi
              fi

              if [ -z "$SQUASH_FILE" ]; then
                echo "  ❌ 所有方法都未能提取 squashfs"
                continue
              fi

              echo "  ✅ 找到 squashfs: $(basename "$SQUASH_FILE")"

              # 解包
              unsquashfs -d squashfs-root "$SQUASH_FILE" >/dev/null 2>&1
              if [ ! -d squashfs-root ]; then
                echo "  ⚠️ 解包失败"
                continue
              fi

              # 注入 lucky
              mkdir -p squashfs-root/usr/bin
              cp "$GITHUB_WORKSPACE/lucky_custom" squashfs-root/usr/bin/lucky
              chmod 755 squashfs-root/usr/bin/lucky
              echo "  ✅ lucky 已注入"

              # 获取原始压缩参数
              COMP=$(unsquashfs -s "$SQUASH_FILE" 2>&1 | grep -o 'Compression[^,]*' | cut -d' ' -f2)
              BLOCK=$(unsquashfs -s "$SQUASH_FILE" 2>&1 | grep -o 'Block size[^,]*' | grep -o '[0-9]*')
              [ -z "$COMP" ] && COMP="xz"
              [ -z "$BLOCK" ] && BLOCK="262144"

              # 重打包
              mksquashfs squashfs-root new-root.squashfs -comp "$COMP" -b "$BLOCK" -noappend >/dev/null 2>&1
              if [ ! -f new-root.squashfs ]; then
                echo "  ⚠️ 重打包失败"
                continue
              fi

              ORIG_SIZE=$(stat -c%s "$SQUASH_FILE")
              NEW_SIZE=$(stat -c%s new-root.squashfs)
              if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
                echo "  ⚠️ 新 squashfs 比原镜像大 $(($NEW_SIZE - $ORIG_SIZE)) 字节！可能无法刷写！"
              fi

              # 获取偏移量
              OFFSET_LINE=$(binwalk "$FW" 2>/dev/null | grep -i squashfs | head -1)
              if [ -n "$OFFSET_LINE" ]; then
                OFFSET=$(echo "$OFFSET_LINE" | awk '{print $1}')
              else
                # 尝试从文件大小估算
                OFFSET=$(( $(stat -c%s "$FW") - $(stat -c%s "$SQUASH_FILE") ))
                echo "  估算偏移量: $OFFSET"
              fi

              # 拼接新固件
              NEW_FW="lucky-$FW"
              head -c "$OFFSET" "$FW" > "$NEW_FW"
              cat new-root.squashfs >> "$NEW_FW"

              if [ -s "$NEW_FW" ]; then
                FINAL_NAME="${TAG//\//-}-$(basename "$NEW_FW")"
                cp "$NEW_FW" "$GITHUB_WORKSPACE/output/$FINAL_NAME"
                echo "  ✅ 注入成功: $FINAL_NAME"
                INJECT_COUNT=$((INJECT_COUNT + 1))
                TOTAL_INJECTED=$((TOTAL_INJECTED + 1))
              else
                echo "  ⚠️ 新固件为空"
              fi

              # 清理
              rm -rf extracted unsquashfs-root squashfs-root new-root.squashfs *.squashfs "$NEW_FW" binwalk.log
            done

            echo "📊 Release $TAG: $INJECT_COUNT/$FIRMWARE_COUNT 固件注入成功"
            cd ..
            rm -rf "$WORK_DIR"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          done

          echo ""
          echo "========================================="
          echo "📊 处理完成统计"
          echo "========================================="
          echo "✅ 成功处理的 Release: $SUCCESS_COUNT"
          echo "❌ 失败的 Release: $FAIL_COUNT"
          echo "📦 总共注入固件: $TOTAL_INJECTED"

      - name: Upload Modified Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: lucky-injected-firmwares-${{ github.run_id }}
          path: output/*
          retention-days: 30
          if-no-files-found: warn

      - name: Create Summary
        run: |
          echo "## 🎯 Lucky 注入结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 处理的 Release | ${{ steps.parse.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 生成的固件数量 | $(ls output/ 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Lucky 大小 | ${{ env.LUCKY_SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lucky SHA256 | ${{ env.LUCKY_SHA256 }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "output" ] && [ -n "$(ls -A output)" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 生成的文件" >> $GITHUB_STEP_SUMMARY
            echo '```' >>  $GITHUB_STEP_SUMMARY
            ls -la output/ >>  $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ 没有生成任何文件" >> $GITHUB_STEP_SUMMARY
          fi

name: Inject Lucky via Fixed Offset (IPQ60xx Sysupgrade)

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: '输入 Release Tag（一行一个）'
        required: true
        type: string

jobs:
  inject-lucky:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools curl jq xxd

      - name: Process Sysupgrade Firmware with Fixed Offset
        run: |
          set -eo pipefail
          mkdir -p output

          # 固定偏移：0x0054b400 = 5551104 字节
          SQUASH_OFFSET=5551104

          mapfile -t TAGS <<< "${{ inputs.release_tags }}"
          for TAG in "${TAGS[@]}"; do
            TAG=$(echo "$TAG" | xargs)
            [ -z "$TAG" ] && continue

            echo ""
            echo "========================================="
            echo "📦 处理 Release: $TAG"
            echo "========================================="

            WORK_DIR="work_$(date +%s)_$$"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # 获取 release 信息
            RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            HTTP_CODE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o release.json "$RELEASE_URL" -w "%{http_code}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ API 请求失败 (HTTP $HTTP_CODE)"
              cat release.json 2>/dev/null || echo "(无响应内容)"
              cd .. && rm -rf "$WORK_DIR"
              continue
            fi

            # 🔍 仅处理 sysupgrade 固件（安全 jq）
            jq -r '
              if has("assets") and (.assets | type == "array") then
                .assets[] |
                select(type == "object") |
                select(has("name") and has("browser_download_url")) |
                select(.name | endswith(".bin") and contains("sysupgrade")) |
                .browser_download_url
              else
                empty
              end
            ' release.json | while IFS= read -r URL; do
              [ -z "$URL" ] && continue

              FILENAME=$(basename "$URL")
              echo "📥 下载 sysupgrade 固件: $FILENAME"
              if ! curl -L -s -o "$FILENAME" "$URL" || [ ! -s "$FILENAME" ]; then
                echo "⚠️ 下载失败"
                continue
              fi

              FILE_SIZE=$(stat -c%s "$FILENAME")
              if [ "$SQUASH_OFFSET" -ge "$FILE_SIZE" ]; then
                echo "  ❌ 偏移 $SQUASH_OFFSET 超出文件大小 ($FILE_SIZE)"
                rm -f "$FILENAME"
                continue
              fi

              echo "🔧 使用固定偏移 $SQUASH_OFFSET (0x$(printf "%08x" $SQUASH_OFFSET)) 提取 rootfs..."

              # === 1. 提取 rootfs ===
              dd if="$FILENAME" of="root.squashfs" bs=1 skip="$SQUASH_OFFSET" 2>/dev/null
              if [ ! -s "root.squashfs" ]; then
                echo "  ❌ 提取的 rootfs 为空"
                rm -f "$FILENAME"
                continue
              fi

              # === 2. 解包 rootfs ===
              rm -rf squashfs-root
              if ! unsquashfs -d squashfs-root root.squashfs >/dev/null 2>&1; then
                echo "  ⚠️ 解包 squashfs 失败"
                rm -f "$FILENAME" root.squashfs
                continue
              fi

              # === 3. 注入 lucky ===
              echo "  🌐 下载 lucky..."
              LUCKY_URL="http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
              if ! curl -L --retry 3 -s -o /tmp/lucky_custom "$LUCKY_URL" || [ ! -s /tmp/lucky_custom ]; then
                echo "  ❌ lucky 下载失败"
                rm -f "$FILENAME" root.squashfs
                continue
              fi
              chmod 755 /tmp/lucky_custom

              mkdir -p squashfs-root/usr/bin
              cp /tmp/lucky_custom squashfs-root/usr/bin/lucky
              chmod 755 squashfs-root/usr/bin/lucky
              echo "  ✅ lucky 已注入"

              # === 4. 重打包 rootfs（保留原始参数）===
              COMP=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Compression[^,]*' | cut -d' ' -f2)
              BLOCK=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Block size[^,]*' | grep -o '[0-9]*')
              [ -z "$COMP" ] && COMP="xz"
              [ -z "$BLOCK" ] && BLOCK="262144"

              mksquashfs squashfs-root new-root.squashfs -comp "$COMP" -b "$BLOCK" -noappend -quiet

              ORIG_ROOT_SIZE=$(stat -c%s root.squashfs)
              NEW_ROOT_SIZE=$(stat -c%s new-root.squashfs)
              if [ $NEW_ROOT_SIZE -gt $ORIG_ROOT_SIZE ]; then
                echo "  ⚠️ 新 rootfs 大了 $(($NEW_ROOT_SIZE - $ORIG_ROOT_SIZE)) 字节，可能无法刷写！"
                # 仍继续生成，供用户判断
              fi

              # === 5. 拼接新固件 ===
              dd if="$FILENAME" of="lucky-$FILENAME" bs=1 count="$SQUASH_OFFSET" status=none 2>/dev/null
              cat new-root.squashfs >> "lucky-$FILENAME"

              if [ -s "lucky-$FILENAME" ]; then
                cp "lucky-$FILENAME" "$GITHUB_WORKSPACE/output/"
                echo "  ✅ 生成注入固件: lucky-$FILENAME"
              else
                echo "  ❌ 拼接后文件为空"
              fi

              # === 清理 ===
              rm -f "$FILENAME" root.squashfs new-root.squashfs /tmp/lucky_custom
              rm -rf squashfs-root
            done

            cd ..
            rm -rf "$WORK_DIR"
          done

      - name: Upload Injected Sysupgrade Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: lucky-sysupgrade-firmwares
          path: output/
          retention-days: 7
          if-no-files-found: warn

      - name: Final Summary
        run: |
          COUNT=$(ls output/ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "✅ 成功生成 $COUNT 个注入版 sysupgrade 固件"
          else
            echo "❌ 未生成任何固件"
            exit 1
          fi

name: Inject Lucky into OpenWrt Releases (Final Stable)

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: '输入 Release Tag（一行一个）'
        required: true
        type: string

jobs:
  inject-lucky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools curl jq

      - name: Download Lucky Binary
        run: |
          LUCKY_URL="http://alistlc.v6.army:13666/d/guset/open/lucky?sign=SiEmUmzQb_m9833knrv72EvyvQ3sEQmil0Hr-zfI92M=:0"
          curl -L --retry 3 --progress-bar -o lucky_custom "$LUCKY_URL"
          chmod 755 lucky_custom
          echo "LUCKY_SIZE=$(du -h lucky_custom | cut -f1)" >> "$GITHUB_ENV"
          echo "LUCKY_SHA256=$(sha256sum lucky_custom | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Process Release
        run: |
          set -eo pipefail
          mkdir -p output

          # 解析输入的 tag（支持多行）
          mapfile -t TAGS <<< "${{ inputs.release_tags }}"
          
          for TAG in "${TAGS[@]}"; do
            TAG=$(echo "$TAG" | xargs)  # 去除首尾空格
            [ -z "$TAG" ] && continue

            echo ""
            echo "========================================="
            echo "📦 处理 Release: $TAG"
            echo "========================================="

            WORK_DIR="work_$(date +%s)_$$"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # 下载 release 信息
            RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
            if ! curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o release.json "$RELEASE_URL" -w "%{http_code}" | grep -q "200"; then
              echo "❌ Release 不存在"
              cd .. && rm -rf "$WORK_DIR"
              continue
            fi

            # 下载所有 .bin 固件
            jq -r '.assets[] | select(.name | endswith(".bin")) | .browser_download_url' release.json | while read -r URL; do
              [ -z "$URL" ] && continue
              FILENAME=$(basename "$URL")
              echo "📥 下载: $FILENAME"
              if ! curl -L -s -o "$FILENAME" "$URL" || [ ! -s "$FILENAME" ]; then
                echo "⚠️ 下载失败: $FILENAME"
                continue
              fi

              echo ""
              echo "🔧 注入 lucky 到: $FILENAME"

              # === 🔍 二进制搜索 squashfs 签名（关键修复：|| true）===
              OFFSET=""
              if [ -s "$FILENAME" ]; then
                HSQS_OFF=$(dd if="$FILENAME" bs=1M count=256 2>/dev/null | grep -aob $'\x68\x73\x71\x73' | head -1 | cut -d: -f1 || true)
                SQSH_OFF=$(dd if="$FILENAME" bs=1M count=256 2>/dev/null | grep -aob $'\x73\x71\x73\x68' | head -1 | cut -d: -f1 || true)

                if [ -n "$HSQS_OFF" ]; then
                  OFFSET=$HSQS_OFF
                elif [ -n "$SQSH_OFF" ]; then
                  OFFSET=$SQSH_OFF
                fi
              fi

              if [ -z "$OFFSET" ]; then
                echo "  ⚠️ 未找到 squashfs 签名"
                rm -f "$FILENAME"
                continue
              fi

              OFFSET_HEX=$(printf "%08x" $OFFSET)
              echo "  📍 找到偏移: $OFFSET (0x$OFFSET_HEX)"

              # === 💾 提取 squashfs ===
              BLOCK_SIZE=1048576
              SKIP_BLOCKS=$((OFFSET / BLOCK_SIZE))
              REMAINDER=$((OFFSET % BLOCK_SIZE))

              if [ $REMAINDER -eq 0 ]; then
                dd if="$FILENAME" of=root.squashfs bs=1M skip=$SKIP_BLOCKS status=none 2>/dev/null
              else
                dd if="$FILENAME" bs=1M skip=$SKIP_BLOCKS status=none 2>/dev/null | \
                dd bs=1 skip=$REMAINDER status=none 2>/dev/null > root.squashfs
              fi

              if [ ! -s root.squashfs ]; then
                echo "  ⚠️ 提取失败：squashfs 为空"
                rm -f "$FILENAME"
                continue
              fi

              if ! unsquashfs -s root.squashfs >/dev/null 2>&1; then
                echo "  ⚠️ 无效的 squashfs"
                rm -f "$FILENAME"
                continue
              fi

              # === 🧬 注入 lucky ===
              rm -rf squashfs-root
              unsquashfs -d squashfs-root root.squashfs >/dev/null 2>&1
              mkdir -p squashfs-root/usr/bin
              cp "$GITHUB_WORKSPACE/lucky_custom" squashfs-root/usr/bin/lucky
              chmod 755 squashfs-root/usr/bin/lucky
              echo "  ✅ lucky 已注入"

              # === 🔄 重打包 ===
              COMP=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Compression[^,]*' | cut -d' ' -f2)
              BLOCK=$(unsquashfs -s root.squashfs 2>&1 | grep -o 'Block size[^,]*' | grep -o '[0-9]*')
              [ -z "$COMP" ] && COMP="xz"
              [ -z "$BLOCK" ] && BLOCK="262144"

              mksquashfs squashfs-root new-root.squashfs -comp "$COMP" -b "$BLOCK" -noappend -quiet

              ORIG_SIZE=$(stat -c%s root.squashfs)
              NEW_SIZE=$(stat -c%s new-root.squashfs)
              echo "  📊 原始: $ORIG_SIZE B, 新: $NEW_SIZE B"
              if [ $NEW_SIZE -gt $ORIG_SIZE ]; then
                echo "  ⚠️ 新镜像过大！可能无法刷写！"
              fi

              # === 🔗 拼接新固件 ===
              NEW_FW="lucky-$FILENAME"
              if [ $REMAINDER -eq 0 ]; then
                dd if="$FILENAME" of="$NEW_FW" bs=1M count=$SKIP_BLOCKS status=none 2>/dev/null
              else
                dd if="$FILENAME" of="$NEW_FW" bs=1M count=$SKIP_BLOCKS status=none 2>/dev/null
                dd if="$FILENAME" bs=1M skip=$SKIP_BLOCKS count=1 status=none 2>/dev/null | \
                dd bs=1 count=$REMAINDER status=none 2>/dev/null >> "$NEW_FW"
              fi
              cat new-root.squashfs >> "$NEW_FW"

              if [ -s "$NEW_FW" ]; then
                cp "$NEW_FW" "$GITHUB_WORKSPACE/output/"
                echo "  ✅ 生成: lucky-$FILENAME"
              else
                echo "  ⚠️ 新固件为空"
              fi

              # 清理
              rm -f "$FILENAME" root.squashfs new-root.squashfs "$NEW_FW"
              rm -rf squashfs-root
            done

            cd ..
            rm -rf "$WORK_DIR"
          done

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: lucky-firmwares
          path: output/
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "## 🎯 注入完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lucky 大小: ${{ env.LUCKY_SIZE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: ${{ env.LUCKY_SHA256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 输出文件数: $(ls output/ 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
